<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Maison Noir</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/boot.js"></script>
</head>

<body data-page="login">

<div id="authGate"><div class="mn-spinner"></div></div>

<div class="mn-page mn-auth-wrap">
  <div class="mn-auth-card">

    <div class="text-center mb-4">
      <a href="index.html" class="mn-brand d-inline-block text-decoration-none mb-3">Maison <span>Noir</span></a>
      <h1 class="h4 mb-1">Welcome back</h1>
      <p class="small text-muted-gold mb-0">Sign in to order from tonight's menu.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               autocomplete="email" placeholder="you@example.com" required>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-gold w-100 py-2">Sign In</button>
    </form>

    <p class="text-center small text-muted-gold mt-4 mb-0">
      New here? <a href="register.html">Create an account</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
